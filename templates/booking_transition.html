<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Booking Confirmation - Swizz Trip</title>
    <link href="https://fonts.googleapis.com/css?family=Merienda|Open+Sans" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/booking_transition.css">
    <link href="../Logo.png" rel="icon" type="image/x-icon">
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <a class="navbar-brand" href="index.html">
            <img class="logo" src="../Logo.png" alt="Swizz Trip">
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="accomodation.html">Accommodations</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="transition-wrapper">
        <div class="ticket-container" id="ticketContainer">
            <div class="ticket">
                <div class="ticket-header">
                    <h2>Booking Details</h2>
                </div>
                <div class="ticket-body">
                    <p class="label">Passenger</p>
                    <h3 id="userName">Guest</h3>
                    
                    <p class="label">Destination Hotel</p>
                    <h3 id="hotelName" class="hotel-title">Loading...</h3>

                    <div class="input-group">
                        <div class="input-field">
                            <label>Check-in</label>
                            <input type="date" id="checkinDate" required>
                        </div>
                        <div class="input-field">
                            <label>Check-out</label>
                            <input type="date" id="checkoutDate">
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="input-field">
                            <label>Guests</label>
                            <input type="number" id="guestCount" min="1" max="10" value="2" required>
                        </div>
                        <div class="input-field">
                            <label>Room Type</label>
                            <select id="roomType" required>
                                <option value="" disabled selected>Select a room</option>
                                <option value="standard">Standard Room</option>
                                <option value="deluxe">Deluxe Room</option>
                                <option value="family">Family Suite</option>
                                <option value="suite">Luxury Suite</option>
                                <option value="penthouse">Penthouse</option>
                                <option value="ocean">Ocean View</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="ticket-details">
                        <div>
                            <p class="label">Booking Date</p>
                            <p id="currentDate">Today</p>
                        </div>
                        <div>
                            <p class="label">Status</p>
                            <p class="status-pending">Pending</p>
                        </div>
                    </div>
                </div>
                <div class="ticket-footer">
                    <button class="btn-confirm" id="confirmBtn" onclick="confirmBooking()">Confirm Booking</button>
                    <div id="bookingMessage" class="mt-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load data on start
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const hotel = urlParams.get('hotel') || 'Swiss Alps Resort';
            document.getElementById('hotelName').innerText = hotel;
            
            const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('currentDate').innerText = today;

            const userStr = localStorage.getItem('swizz_user');
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    document.getElementById('userName').innerText = user.name;
                } catch(e) {}
            } else {
                document.getElementById('bookingMessage').innerHTML = '<span style="color:red">Please <a href="sign_up.html" style="color:yellow; text-decoration:underline;">sign in</a> to book.</span>';
                document.getElementById('confirmBtn').disabled = true;
            }

        });

        async function confirmBooking() {
            const hotelName = document.getElementById('hotelName').innerText;
            const token = localStorage.getItem('swizz_token');
            const msgBox = document.getElementById('bookingMessage');
            const btn = document.getElementById('confirmBtn');

            if (!token) {
                window.location.href = 'sign_up.html';
                return;
            }

            const checkin = document.getElementById('checkinDate').value;
            const roomType = document.getElementById('roomType').value;
            
            if (!checkin) {
                msgBox.innerHTML = '<span style="color: #ff9800;">Please select a Check-in date to proceed.</span>';
                return;
            }
            if (!roomType) {
                msgBox.innerHTML = '<span style="color: #ff9800;">Please select a Room Type to proceed.</span>';
                return;
            }

            try {
                btn.innerText = 'Processing...';
                btn.disabled = true;

                const response = await fetch('/api/book', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ hotel_name: hotelName })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    msgBox.innerHTML = '<span style="color: #00ff00;">Booking Confirmed Successfully!</span>';
                    btn.innerText = 'Confirmed ✔';
                    btn.style.background = '#00ff00';
                    btn.style.color = '#000';
                    document.querySelector('.status-pending').innerText = 'Confirmed';
                    document.querySelector('.status-pending').className = 'status-confirmed';
                } else {
                    msgBox.innerHTML = `<span style="color: red;">${data.message}</span>`;
                    btn.innerText = 'Confirm Booking';
                    btn.disabled = false;
                }
            } catch (error) {
                msgBox.innerHTML = '<span style="color: red;">Network error.</span>';
                btn.innerText = 'Confirm Booking';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
