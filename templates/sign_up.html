<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up / Login - Swizz Trip</title>
    <link href="https://fonts.googleapis.com/css?family=Merienda|Open+Sans" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/sign_up.css">
    <link href="../Logo.png" rel="icon" type="image/x-icon">
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <a class="navbar-brand" href="index.html">
            <img class="logo" src="../Logo.png" alt="Swizz Trip">
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="scene">
            <div class="auth-card" id="authCard">
                <!-- Login Face -->
                <div class="card-face card-front">
                    <h2 class="auth-title">Welcome Back</h2>
                    <p class="auth-subtitle">Sign in to your account</p>
                    <form id="loginForm">
                        <div class="user-box">
                            <input type="email" id="loginEmail" name="email" required="">
                            <label>Email</label>
                        </div>
                        <div class="user-box">
                            <input type="password" id="loginPassword" name="password" required="">
                            <label>Password</label>
                        </div>
                        <button type="submit" class="btn-auth">Sign In</button>
                    </form>
                    <p class="switch-text">Don't have an account? <span onclick="flipCard()">Sign up here</span></p>
                    <div id="loginMessage" class="mt-3"></div>
                </div>
                
                <!-- Sign Up Face -->
                <div class="card-face card-back">
                    <h2 class="auth-title">Create Account</h2>
                    <p class="auth-subtitle">Join us for your next adventure</p>
                    <form id="signupForm">
                        <div class="user-box">
                            <input type="text" id="signupName" name="name" required="">
                            <label>Full Name</label>
                        </div>
                        <div class="user-box">
                            <input type="email" id="signupEmail" name="email" required="">
                            <label>Email</label>
                        </div>
                        <div class="user-box">
                            <input type="password" id="signupPassword" name="password" required="">
                            <label>Password</label>
                        </div>
                        <button type="submit" class="btn-auth">Sign Up</button>
                    </form>
                    <p class="switch-text">Already have an account? <span onclick="flipCard()">Sign in here</span></p>
                    <div id="signupMessage" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem("swizz_token")) {
                window.location.href = "/";
            }
        });

        function flipCard() {
            const card = document.getElementById('authCard');
            card.classList.toggle('is-flipped');
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const msgBox = document.getElementById('signupMessage');
            
            try {
                msgBox.innerHTML = '<span style="color: blue;">Registering...</span>';
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                
                const data = await response.json();
                if (response.ok) {
                    msgBox.innerHTML = '<span style="color: green;">Registration successful! Please sign in.</span>';
                    setTimeout(() => {
                        flipCard();
                        document.getElementById('loginEmail').value = email;
                    }, 1500);
                } else {
                    msgBox.innerHTML = `<span style="color: red;">${data.message}</span>`;
                }
            } catch (error) {
                msgBox.innerHTML = '<span style="color: red;">Error connecting to server.</span>';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const msgBox = document.getElementById('loginMessage');
            
            try {
                msgBox.innerHTML = '<span style="color: blue;">Signing in...</span>';
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                if (response.ok) {
                    msgBox.innerHTML = '<span style="color: green;">Login successful!</span>';
                    localStorage.setItem('swizz_token', data.token);
                    localStorage.setItem('swizz_user', JSON.stringify(data.user));
                    setTimeout(() => {
                        window.location.href = 'index.html'; // Redirect to home or bookings
                    }, 1000);
                } else {
                    msgBox.innerHTML = `<span style="color: red;">${data.message}</span>`;
                }
            } catch (error) {
                msgBox.innerHTML = '<span style="color: red;">Error connecting to server.</span>';
            }
        });
    </script>
</body>
</html>
